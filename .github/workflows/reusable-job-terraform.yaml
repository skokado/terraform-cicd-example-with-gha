on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      working_dir:
        required: true
        type: string
      aws_role_arn:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: "ap-northeast-1"
      is_apply:
        required: true
        type: boolean

env:
  terraform_version: "~> 1.13.0"
  tf_actions_working_dir: ${{ inputs.working_dir }}

# Ref. https://github.com/hashicorp/setup-terraform?tab=readme-ov-file#usage
jobs:
  main:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_dir }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        # skip because example
        if: !always()
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_role_arn }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform_version }}
      
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: ${{ !inputs.is_apply }}
        run: terraform plan -out=tfplan
        continue-on-error: true

      - name: Terraform Show
        id: plan
        if: ${{ !inputs.is_apply }}
        run: terraform show -no-color tfplan
        continue-on-error: true

      - uses: actions/github-script@v7
        if: ${{ !inputs.is_apply }}
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style') &&
              comment.body.includes("Env: `${{ inputs.env }}`")
            })

            // 2. Prepare format of the comment
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.tf_actions_working_dir }}\`, Workflow: \`${{ github.workflow }}\`, Env: \`${{ inputs.env }}\`*`;

            // 3. If we have a comment, update it, otherwise create a new one
            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      # --- terraform apply (IssueOps)
      - name: "Terraform apply"
        id: apply
        if: ${{ inputs.is_apply }}
        run: |
          terraform apply -auto-approve -var-file ./envs/${{ inputs.env }}/terraform.tfvars

      - uses: actions/github-script@v7
        if: ${{ inputs.is_apply }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `🤖IssueOps: Executed \`terraform apply\`.

            <details><summary>Show stdout</summary>

            \`\`\`\n
            ${{ steps.apply.outputs.stdout }}
            \`\`\`

            </details>

            *Actor: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.tf_actions_working_dir }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
