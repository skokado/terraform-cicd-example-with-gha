name: "Terraform (dev)"

on:
  push:
    branches:
      - develop
    paths:
      - "envs/dev/**"
      - "module/**"
      - ".github/workflows/terraform-dev.yaml"
      - ".github/workflows/reusable-job-terraform.yaml"
      - "!*.md"

  pull_request:
    branches:
      - main
    paths:
      - "envs/dev/**"
      - "module/**"
      - ".github/workflows/terraform-dev.yaml"
      - ".github/workflows/reusable-job-terraform.yaml"
      - "!*.md"

jobs:
  terraform:
    uses: ./.github/workflows/reusable-job-terraform.yaml
    with:
      env: "dev"
      working_dir: "envs/dev"
      aws_role_arn: "arn:aws:iam::12345678910:role/my-cicd-role-dev"
      aws_region: "ap-northeast-1"
      is_apply: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

    secrets: inherit
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: write
